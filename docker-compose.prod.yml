# Production deployment configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # MariaDB - Production settings
  db:
    restart: always
    # Don't expose database port in production
    ports: []
    
  # .NET Core API - Production build
  api:
    build:
      target: production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Use ALLOWED_ORIGINS for flexible CORS configuration
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    volumes: []  # Remove development volumes
    restart: always

  # Vue.js Frontend - Production build
  web:
    build:
      target: production
    environment:
      NODE_ENV: production
    volumes: []  # Remove development volumes
    restart: always

  # Vuestic Admin - Production build
  admin:
    build:
      target: production
    environment:
      NODE_ENV: production
    volumes: []  # Remove development volumes
    restart: always

  # Adminer is not needed in production
  adminer:
    deploy:
      replicas: 0