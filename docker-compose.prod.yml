# Production deployment configuration
# This file completely redefines services for production
# Usage: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # MariaDB Database - Production configuration
  db:
    image: mariadb:11
    container_name: badminton-forum-db
    restart: always
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-badmintonforumdb}
      MARIADB_USER: ${MARIADB_USER:-badmintonuser}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-BadmintonPass123}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass123}
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - badminton-network
    # Don't expose database port in production
    
  # .NET Core API - Production build
  api:
    build:
      context: ./BadmintonForum.API
      dockerfile: Dockerfile
      target: production
    container_name: badminton-forum-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5246
      ConnectionStrings__DefaultConnection: "Server=db;Database=${MARIADB_DATABASE:-badmintonforumdb};User=${MARIADB_USER:-badmintonuser};Password=${MARIADB_PASSWORD:-BadmintonPass123};CharSet=utf8mb4;"
      JwtSettings__Secret: ${JWT_SECRET:-ThisIsAVerySecretKeyForJWTTokenGenerationPleaseChangeInProduction}
      JwtSettings__Issuer: ${JWT_ISSUER:-BadmintonForumAPI}
      JwtSettings__Audience: ${JWT_AUDIENCE:-BadmintonForumClient}
      JwtSettings__ExpirationInDays: ${JWT_EXPIRATION_DAYS:-7}
      Email__UseConsoleEmail: "false"
      Email__BaseUrl: ${EMAIL_BASE_URL:-http://localhost:5173}
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
      DefaultAdmin__Email: ${DEFAULT_ADMIN_EMAIL:-admin@badminton-forum.com}
      DefaultAdmin__Password: ${DEFAULT_ADMIN_PASSWORD:-Admin123456!}
      # Use ALLOWED_ORIGINS for flexible CORS configuration
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # Pass MariaDB credentials to docker-entrypoint.sh
      MARIADB_USER: ${MARIADB_USER:-badmintonuser}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-BadmintonPass123}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-badmintonforumdb}
    ports:
      - "${API_PORT:-5246}:5246"
    # NO volumes mounting in production - use compiled DLL from image
    depends_on:
      db:
        condition: service_healthy
    networks:
      - badminton-network
    command: ["./docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5246/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Vue.js Frontend - Production build
  web:
    build:
      context: ./badminton-forum-vue
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5246/api}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
    container_name: badminton-forum-web
    restart: always
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5246/api}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
    ports:
      - "${WEB_PORT:-5173}:80"
    # NO volumes mounting in production - use built files from image
    depends_on:
      api:
        condition: service_healthy
    networks:
      - badminton-network

  # Vuestic Admin Panel - Production build
  admin:
    build:
      context: ./badminton-forum-admin
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5246/api}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
        VITE_APP_NAME: ${ADMIN_APP_NAME:-羽球論壇管理後台}
    container_name: badminton-forum-admin
    restart: always
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5246/api}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}
      VITE_APP_NAME: ${ADMIN_APP_NAME:-羽球論壇管理後台}
    ports:
      - "${ADMIN_PORT:-5174}:80"
    # NO volumes mounting in production - use built files from image
    depends_on:
      api:
        condition: service_healthy
    networks:
      - badminton-network

  # Adminer is not included in production

networks:
  badminton-network:
    driver: bridge

volumes:
  mariadb_data: